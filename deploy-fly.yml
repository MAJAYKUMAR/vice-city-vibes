# Deploy the Vice City Vibes watcher to Fly.io, and publish its image to GHCR.
#
# This is the reliable deploy route: deploying from the dev VM kept failing
# (Fly token scope / Depot builder hangs, and this VM cannot reach Modal's
# server either). The GitHub runner does the build and deploy instead.
#
# Required secret (set it once, never put a token in this file):
#   Settings > Secrets and variables > Actions > FLY_API_TOKEN
#   = a Fly Personal Access Token (fly.io dashboard > account > Tokens).
# Without it the Fly step fails; the GHCR image step still runs.
name: Deploy watcher to Fly

on:
  push:
    branches: [main]
    paths:
      - 'deploy/fly/**'
      - 'src/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/fly/Dockerfile
          push: true
          tags: |
            ghcr.io/MAJAYKUMAR/vice-city-vibes-clipper:${{ github.sha }}
            ghcr.io/MAJAYKUMAR/vice-city-vibes-clipper:latest

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly volume if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl volumes list -a vice-city-vibes-clipper || true
          flyctl volumes create clipper_data --size 1 -a vice-city-vibes-clipper --region dfw --yes || echo "volume already exists (or create failed — deploy step will report it)"

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile
